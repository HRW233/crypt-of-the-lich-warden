name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # never cancel a deploy mid-flight: that orphans the Pages deployment and
  # every later run is rejected with "due to in progress deployment"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the published build
        run: |
          mkdir -p site/js
          base="https://site-497624e43cfb49f8a58564653cb22aff.freebuff.page"
          curl -fsSL --max-time 60 "$base/" -o site/index.html
          curl -fsSL --max-time 60 "$base/style.css" -o site/style.css
          for f in core sound particles bullets dungeon player enemies upgrades bosses net game; do
            curl -fsSL --max-time 60 "$base/js/$f.js" -o "site/js/$f.js"
          done
          ls -l site site/js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The repo's own copy of the game: js/ and style.css at the root, so the
      # code can be read and cloned from GitHub, not just played on Pages.
      # It stops before pushing when nothing changed, which is also what keeps
      # this run from triggering itself forever.
      - name: Keep the repo source in sync
        continue-on-error: true
        run: |
          git clone -q --depth 1 \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/repo
          cd /tmp/repo
          mkdir -p js
          cp "$GITHUB_WORKSPACE/site/style.css" style.css
          cp "$GITHUB_WORKSPACE"/site/js/*.js js/
          git add -A
          if git diff --cached --quiet; then
            echo "source already matches the deployment"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Sync the published source"
          git push

      # The relay and the balance bot are not part of the site, so nothing
      # above can regenerate them: they only exist in the repo. A clone is
      # only worth having if `node server/lan.js` works in it, so say so
      # loudly here rather than discovering it when two people try to play.
      - name: Check a clone can host co-op
        run: |
          missing=0
          for f in index.html style.css server/lan.js tools/testbot.js; do
            if [ ! -s "/tmp/repo/$f" ]; then
              echo "::error::/tmp/repo/$f is missing, a clone could not host co-op"
              missing=1
            fi
          done
          scripts=$(ls "$GITHUB_WORKSPACE"/site/js/*.js 2>/dev/null | wc -l)
          if [ "$scripts" -ne 11 ]; then
            echo "::error::expected 11 scripts in site/js, found $scripts"
            missing=1
          fi
          if ! node --check /tmp/repo/server/lan.js; then
            echo "::error::server/lan.js does not parse"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "clone is complete: game, relay and balance bot"

      - name: Mirror the build to the gh-pages branch
        continue-on-error: true
        run: |
          cd site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Mirror published build"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
